name: Build Chat Kemer (LeviLauncher ARM64)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify preinstalled build tools
        run: |
          cmake --version
          ninja --version
          zip -v | head -n 2
          llvm-readelf --version || readelf --version
      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Build and validate LeviPack
        run: bash ./scripts/build-android.sh
      - name: Upload LeviLauncher package
        uses: actions/upload-artifact@v4
        with:
          name: ChatKemer-LeviLauncher-arm64
          path: dist/arm64-v8a/ChatKemer.levipack
          if-no-files-found: error

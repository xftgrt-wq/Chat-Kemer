name: Build Chat Kemer (LeviLauncher ARM64)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build zip binutils
      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Build and validate LeviPack
        run: ./scripts/build-android.sh
      - name: Upload LeviLauncher package
        uses: actions/upload-artifact@v4
        with:
          name: ChatKemer-LeviLauncher-arm64
          path: dist/arm64-v8a/ChatKemer.levipack
          if-no-files-found: error
